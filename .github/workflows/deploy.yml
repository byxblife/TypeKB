name: Deploy TypeKB Prototype

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 建置 Prototype
        run: npm run build

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 發布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
